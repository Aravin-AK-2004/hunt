<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="μhunt - Enter your name and discover your unique hunter pass stats and cipher rank.">
  <meta name="theme-color" content="#070914">
  <title>μhunt | Enter Your Name</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Interactive Particle Background Canvas -->
  <canvas id="bgCanvas"></canvas>

  <!-- Main Mobile App Layout Container -->
  <main class="app-container">
    
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="protocol-badge">
        <span class="protocol-dot"></span>
        <span>μ-PROTOCOL V2.4</span>
      </div>
      
      <button class="audio-toggle-btn active" id="audioToggleBtn" title="Toggle Sound FX" aria-label="Toggle Sound Effects">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
    </header>

    <!-- Center Content Wrapper -->
    <section class="content-wrapper">
      
      <!-- Big Mobile Heading -->
      <div class="brand-heading-group">
        <h1 class="brand-heading"><span class="symbol-mu">μ</span>hunt</h1>
        <p class="brand-subtext">Enter your name to initiate protocol</p>
      </div>

      <!-- Name Entry Card -->
      <div class="form-card" id="formCard">
        <div class="input-group">
          <input 
            type="text" 
            id="nameInput" 
            class="name-input" 
            placeholder=" " 
            maxlength="32" 
            autocomplete="off" 
            autocorrect="off" 
            spellcheck="false"
            aria-label="Enter your name"
          >
          <label for="nameInput" class="input-label">YOUR HUNTER NAME</label>
          <span class="char-counter" id="charCounter">0/32</span>
        </div>

        <button class="submit-btn" id="submitBtn" aria-label="Start Hunt">
          <span>ENTER THE HUNT</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

      <!-- Result Badge Result View (Generated Live) -->
      <div class="result-wrapper" id="resultWrapper">
        
        <div class="hunter-badge" id="hunterBadge">
          <div class="badge-glow-bg"></div>
          
          <div class="badge-header">
            <span class="badge-brand">μhunt PASS</span>
            <span class="badge-id" id="badgeId">µ-0000</span>
          </div>

          <div class="badge-body">
            <div class="badge-avatar" id="badgeAvatar">?</div>
            <div class="badge-info">
              <h2 class="badge-name" id="badgeName">Hunter</h2>
              <div class="badge-title" id="badgeTitle">⚡ QUANTUM SEEKER</div>
            </div>
          </div>

          <div class="badge-stats">
            <div class="stat-item">
              <span class="stat-val" id="statAgility">95%</span>
              <span class="stat-lbl">Agility</span>
            </div>
            <div class="stat-item">
              <span class="stat-val" id="statCipher">88%</span>
              <span class="stat-lbl">Cipher</span>
            </div>
            <div class="stat-item">
              <span class="stat-val" id="statPower">92%</span>
              <span class="stat-lbl">Power</span>
            </div>
          </div>
        </div>

        <div class="action-grid">
          <button class="secondary-btn" id="downloadBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Save Badge</span>
          </button>
          
          <button class="secondary-btn" id="resetBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            <span>Hunt Again</span>
          </button>
        </div>

      </div>

    </section>

    <!-- Footer & Recent Hunters -->
    <footer class="app-footer">
      <div class="recent-hunters-box">
        <div class="recent-title">Recent Hunters</div>
        <div class="recent-chips" id="recentChips">
          <!-- Loaded securely via JS -->
        </div>
      </div>
      <div class="footer-credits">μhunt Protocol &copy; 2026</div>
    </footer>

  </main>

  <!-- Toast Notification Message -->
  <div class="toast-msg" id="toastMsg">Welcome to μhunt</div>

  <!-- JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
